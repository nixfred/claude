<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>og-image source — element-screenshot #card to og.png</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box; -webkit-text-size-adjust:100%; text-size-adjust:100%}
  body{background:#000; font-family:'JetBrains Mono','SF Mono',monospace}
  /* #card has a fixed width; height grows to fit so nothing is ever clipped */
  #card{
    width:1200px; position:relative;
    background:#0d1117;
  }
  #card::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
    opacity:.4; mix-blend-mode:multiply;
  }
  .bar{
    display:flex; align-items:center; gap:12px;
    padding:22px 32px; border-bottom:1px solid #21262d; background:#010409;
  }
  .dot{width:14px; height:14px; border-radius:50%}
  .bar .t{margin-left:18px; color:#6e7681; font-size:21px}
  .bar .t b{color:#c9d1d9}
  .bar .ctx{margin-left:auto; color:#484f58; font-size:17px}
  .stage{padding:50px 76px 16px}
  .scroll{color:#484f58; font-size:20px; letter-spacing:1px; margin-bottom:34px}
  .u{color:#58a6ff; font-size:26px; font-weight:700; margin-bottom:34px}
  .who{color:#d2a8ff; font-weight:700; font-size:26px; margin-bottom:18px}
  .hero{color:#c9d1d9; font-size:39px; font-weight:700; line-height:1.45}
  .hero .you{color:#fff}
  .hero .snark{color:#f85149}
  .cursor{
    display:inline-block; width:15px; height:33px; background:#d2a8ff;
    vertical-align:-5px; margin-left:6px;
  }
  .foot{
    display:flex; justify-content:space-between; align-items:center;
    padding:26px 32px 30px; color:#6e7681; font-size:19px;
  }
  .foot .url{color:#7ee787; font-weight:700; font-size:22px}
</style>
</head>
<body>
  <div id="card">
    <div class="bar">
      <span class="dot" style="background:#ff5f56"></span>
      <span class="dot" style="background:#ffbd2e"></span>
      <span class="dot" style="background:#27c93f"></span>
      <span class="t"><b>claude code</b> — a conversation</span>
      <span class="ctx">opus 4.7 · 1M</span>
    </div>
    <div class="stage">
      <div class="scroll">· · ·  2,847 messages earlier  · · ·</div>
      <div class="u">&gt; who's reading this?</div>
      <div class="who">● Larry</div>
      <div class="hero">
        Oh. <span class="you">You</span> opened the link. Bold.<br>
        Now sit down — this is about to get <span class="snark">very snarky</span>.<span class="cursor"></span>
      </div>
    </div>
    <div class="foot">
      <span class="url">nixfred.com/claude</span>
      <span>the third page in the trilogy</span>
    </div>
  </div>
</body>
</html>
